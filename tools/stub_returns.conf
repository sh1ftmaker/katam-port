# Return values for stubbed functions, where 0 is the wrong answer.
#
# A stub normally returns 0, which is harmless for a function whose result is
# ignored and fatal for one that drives a state machine.  Each line here is
# `symbol value`, and both portify.py and gen_stubs.py honour it.
#
# Read by: tools/portify.py, tools/gen_stubs.py

# --- the VRAM transfer queue -------------------------------------------------
# main.c drains the queue through a table of four workers:
#
#     gUnk_030035D4 = 0xff;
#     for (; j <= 3; j++)
#         if (gUnk_08D5FDD4[j]() == 0) { gUnk_030035D4 = j; break; }
#
# A 0 means "did not finish"; the main loop then remembers where to resume and
# stops calling TasksExec() until the queue drains.  A stub returning 0 says
# "never finished", so the game runs its VBlank handler forever and never
# updates again -- it boots to a blank screen and sits there.
#
# 1 is "nothing left to do", which is true: the stub did not queue anything.
sub_08154B14 1
sub_0815436C 1
sub_08153184 1
sub_081525DC 1
