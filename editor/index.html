<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="katam-build" content="c203a5eb5 2026-11-09 wasm ec2569ecd4e2">
<meta name="robots" content="noindex">
<title>KATAM Level Editor</title>
<link rel="stylesheet" href="editor.css?v=184fc6023a7e">
</head>
<body>
<div id="app" class="loading">
  <header id="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.4 7 .9-5.1 4.9 1.3 7-6.2-3.4L5.8 21l1.3-7L2 9.1l7-.9z"/></svg>
      <div><b>KATAM Level Editor</b><small>Kirby &amp; The Amazing Mirror (PC Port)</small></div>
    </div>
    <div class="menus">
      <button class="btn menu" data-menu="file">File <i>▾</i></button>
      <button class="btn menu" data-menu="edit">Edit <i>▾</i></button>
      <button class="btn menu" data-menu="view">View <i>▾</i></button>
    </div>
    <span class="grow"></span>
    <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="btn icon" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    <button class="btn" id="validate"><span class="dot ok" id="vdot">✓</span><span class="lbl">Validate</span></button>
    <button class="btn primary" id="play">▶ <span class="lbl">Play here</span></button>
    <button class="btn" id="save" title="Download the project as a .zip">⬇ <span class="lbl">Save</span></button>
  </header>

  <nav id="tools" aria-label="Tools"></nav>

  <main id="stage">
    <div class="bar">
      <select id="roomsel" aria-label="Room"></select>
      <label class="chk"><input type="checkbox" id="sh-collision" checked><span>Show collision</span></label>
      <label class="chk"><input type="checkbox" id="sh-objects" checked><span>Show objects</span></label>
      <label class="chk"><input type="checkbox" id="sh-camera"><span>Show camera (240×160)</span></label>
      <span class="grow"></span>
      <span class="zoom"><button class="btn icon" id="zout" aria-label="Zoom out">−</button><select id="zoomsel" aria-label="Zoom"></select><button class="btn icon" id="zin" aria-label="Zoom in">+</button></span>
      <button class="btn icon" id="gridbtn" title="Grid" aria-label="Grid" aria-pressed="true">#</button>
    </div>
    <div id="scroll"><canvas id="cv" width="16" height="16"></canvas></div>
    <div class="legend" id="legend"></div>
  </main>

  <aside id="side">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="tiles">Tiles</button>
      <button class="tab" data-tab="objects">Objects</button>
      <button class="tab" data-tab="enemies">Enemies</button>
      <button class="tab" data-tab="rooms">Rooms</button>
    </div>
    <div class="panel" id="tabbody"></div>
    <div class="panel" id="inspector"></div>
  </aside>

  <footer id="bottom">
    <section class="card" id="areamap"><h3>Area Map</h3><div class="body"></div></section>
    <section class="card" id="thumbs"><h3>Room Thumbnails</h3><div class="body"></div></section>
    <section class="card" id="issues"><h3>Validation</h3><div class="body"></div></section>
  </footer>

  <div id="status"><span id="st-text">Starting…</span><span class="grow"></span>
    <button class="btn tiny only-compact" id="tg-side">Palette</button>
    <button class="btn tiny only-compact" id="tg-bottom">Rooms &amp; issues</button>
    <span class="dim" id="st-build"></span></div>
</div>

<div id="curtain">
  <div class="box">
    <svg class="logo big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3 6.4 7 .9-5.1 4.9 1.3 7-6.2-3.4L5.8 21l1.3-7L2 9.1l7-.9z"/></svg>
    <h1>KATAM Level Editor</h1>
    <p id="cur-msg">Starting…</p>
    <label class="btn primary" id="cur-pick" hidden>Choose your ROM file<input type="file" id="romfile" accept=".gba,.bin,application/octet-stream" hidden></label>
    <p class="dim">The editor draws tiles from your own copy of the game. The file stays in this browser and is never uploaded.</p>
  </div>
</div>

<div id="playview" hidden>
  <div class="playbar"><button class="btn primary" id="play-back">◀ Back to editor</button><button class="btn" id="play-restart">↻ Restart</button><span id="play-msg"></span></div>
</div>
<div id="menu" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>window.KATAM_ED = { lib: "katam-902658d36ac9/lib/", data: "data.json?v=d8de1dda60df", play: "play/", build: "c203a5eb5 2026-11-09 wasm ec2569ecd4e2" };</script>
<script type="module" src="editor.js?v=361e6a44dba1"></script>
</body>
</html>
